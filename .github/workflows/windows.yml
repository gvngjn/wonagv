name: Windows 앱 빌드

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: 단위 테스트
        run: dotnet test windows/tests/LaundryTime.Core.Tests

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: 단일 실행 파일로 게시 (.NET 설치 불필요)
        run: >
          dotnet publish windows/src/LaundryTime.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: LaundryTime-win-x64
          path: publish/LaundryTime.exe
