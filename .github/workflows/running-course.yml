name: 러닝 코스 테스트

on:
  push:
    paths:
      - "running-course/**"
      - ".github/workflows/running-course.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 코스 생성 테스트
        run: node --test running-course/test/*.test.js
