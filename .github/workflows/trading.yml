name: 자동매매 테스트

on:
  push:
    paths:
      - "trading/**"
      - ".github/workflows/trading.yml"
  pull_request:
    paths:
      - "trading/**"
      - ".github/workflows/trading.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 단위 테스트
        run: python -m unittest discover -s tests -t . -v
      - name: 가상 데이터 백테스트
        run: python -m trendbot demo
